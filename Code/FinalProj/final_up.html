<!DOCTYPE html>
<html>

<head><title>BuneaFinal</title></head>

<body>
<div>I think my train is coming! <button id= "button">I see it!</button></div>

<canvas id="gl-canvas" width="694" height="648"></canvas>

<style>
    #gl-canvas {
      background-image: url('Images/Background1.png');
      background-size: 100% 100%;
    }
</style>


<img id = "texImage" src = "Images/metroface_noback.png" hidden></img>
<img id = "texImage2" src = "Images/metroside.png" hidden></img>
<img id = "texImage3" src = "Images/PlatformLightsLit.png" hidden></img>
<img id = "texImage4" src = "Images/PlatformLightsDim.png" hidden></img>




<script id="vertex-shader" type="x-shader/x-vertex">
    #version 300 es
    
    in  vec4 aPosition;
    in  vec3 aNormal;
    in vec4 aColor;
    in vec2 aTexCoord;
    
    uniform mat4 ModelViewMatrix;
    uniform mat4 ProjectionMatrix;
    uniform vec4 LightPosition;
    
    
    out vec3 N, L, E;
    out vec4 vColor;
    out vec2 vTexCoord;
    
    
    void main()
    {
        vTexCoord = aTexCoord;
        vec3 pos = (ModelViewMatrix * aPosition).xyz;
        vec3 light = (ModelViewMatrix * LightPosition).xyz;
        L = normalize(light - pos);
        E = normalize(-pos);
        vec4 NN = vec4(aNormal, 0);
        N = normalize((ModelViewMatrix * NN).xyz);
    
        vColor = aColor; 
        gl_Position = ProjectionMatrix * ModelViewMatrix * aPosition;
    }
    </script>

<script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        
        precision mediump float;
        
        in vec4 vColor;
        in vec3 N, L, E;
        in vec2 vTexCoord;
        
        uniform bool Lighting;
        uniform int uUseTexture;  
        uniform sampler2D uTexMap; 
        uniform sampler2D uTexMap2;
        uniform sampler2D uTexMap3;
        uniform sampler2D uTexMap4;


        uniform vec4 AmbientProduct; 
        uniform vec4 DiffuseProduct; 
        uniform vec4 SpecularProduct; 
        uniform float Shininess;
        
        out vec4 fColor;
        
        
        void main()
        {
            if (uUseTexture == 1) {
                fColor = texture(uTexMap, vTexCoord);
            } else if (uUseTexture == 2) {
                fColor = texture(uTexMap2, vTexCoord);
            } else if (uUseTexture == 3) {
                fColor = texture(uTexMap3, vTexCoord);
            }
            else if (uUseTexture == 4) {
                fColor = texture(uTexMap4, vTexCoord);
            }
            else if (Lighting) {
                vec3 H = normalize(L + E);
                vec4 ambient = AmbientProduct;
                float Kd = max(dot(L, N), 0.0);
                vec4 diffuse = Kd * DiffuseProduct;
                float Ks = pow(max(dot(N, H), 0.0), Shininess);
                vec4 specular = Ks * SpecularProduct;
                if (dot(L, N) < 0.0) specular = vec4(0.0, 0.0, 0.0, 1.0);
                fColor = (ambient + diffuse + specular)*vColor;
                fColor.a = .99999;
            } else {
                fColor = vColor;
            }
        }   
</script>




<script src="../Common/initShaders.js"></script>
<script src="../Common/MVnew.js"></script>
<script src="final_up.js"></script>

</body>
</html>
